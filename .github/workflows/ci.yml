name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install runtime + dev deps
        run: |
          python -m pip install --upgrade pip
          # Core runtime deps the test suite imports, plus the test toolchain.
          pip install -e ".[dev]"

      - name: Run test suite
        run: pytest

  shell-test:
    name: shell tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: cicd_scanner.sh tests
        run: bash tests/test_cicd_scanner.sh

  compile:
    name: byte-compile (syntax)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile first-party Python
        # Catches syntax errors across all first-party code without needing
        # every optional dependency installed.
        run: python -m compileall -q tools memory mcp scripts tests

  lint:
    name: ruff (advisory)
    runs-on: ubuntu-latest
    # Advisory only for now: ruff config in pyproject.toml selects pyflakes (F)
    # on first-party code. Does not block merges while the backlog is cleared.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check .
